name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out planner
        uses: actions/checkout@v4
        with:
          path: imaginarium-theater-planner
      - name: Check out shared icons
        uses: actions/checkout@v4
        with:
          repository: Watchfuls/genshin-shared
          path: genshin-shared
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: imaginarium-theater-planner/package-lock.json
      - name: Install dependencies
        working-directory: imaginarium-theater-planner
        run: npm ci
      - name: Build site
        working-directory: imaginarium-theater-planner
        run: npm run build
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: imaginarium-theater-planner/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
